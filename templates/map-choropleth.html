<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9/dist/leaflet.min.css">
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9/dist/leaflet.min.js"></script>
  <!-- proj4js + proj4leaflet for EPSG:5179 → WGS84 reprojection -->
  <script src="https://cdn.jsdelivr.net/npm/proj4@2.11/dist/proj4.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/proj4leaflet@1.0.2/src/proj4leaflet.js"></script>
  <style>
    :root {
      --bg: #f5f1e8; --panel: #fffdf8; --text: #1e2a2f;
      --muted: #6a747a; --grid: #d8d1c3; --accent: #8f7a52;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: "Pretendard", "Noto Sans KR", -apple-system, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top left, #fff6dd 0, transparent 28%),
                  linear-gradient(180deg, #f7f2e7 0%, #efe8da 100%);
      min-height: 100vh;
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 32px 20px 40px; }
    h1 { font-size: 28px; line-height: 1.3; letter-spacing: -0.02em; margin-bottom: 8px; text-align: center; }
    .subtitle { color: var(--muted); line-height: 1.6; text-align: center; margin-bottom: 20px; }
    .panel {
      padding: 18px; border: 1px solid #e4dac7; border-radius: 16px;
      background: var(--panel); box-shadow: 0 8px 24px rgba(81, 65, 27, 0.06);
      margin-bottom: 20px;
    }
    #map { width: 100%; height: 600px; border-radius: 10px; }
    .crs-note {
      font-size: 12px; color: var(--muted); margin-top: 10px;
      padding: 8px 12px; background: #f7f2e7; border-radius: 8px;
      border-left: 3px solid var(--accent);
    }
    .legend {
      background: var(--panel); padding: 10px 14px; border-radius: 10px;
      border: 1px solid #e4dac7; font-size: 13px; line-height: 1.9;
      box-shadow: 0 2px 8px rgba(81,65,27,0.08); min-width: 140px;
    }
    .legend-title { font-weight: 600; margin-bottom: 6px; }
    .legend-row { display: flex; align-items: center; gap: 7px; }
    .legend-swatch { width: 18px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.12); }
    .source { font-size: 13px; color: var(--muted); margin-top: 16px; }
    @media (max-width: 720px) {
      h1 { font-size: 22px; }
      #map { height: 440px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>{{TITLE}}</h1>
    <p class="subtitle">{{SUBTITLE}}</p>

    <div class="panel">
      <div id="map"></div>
      <p class="crs-note">
        좌표계 처리: SGIS 경계 GeoJSON(<strong>EPSG:5179 UTM-K</strong>)을 자동으로
        <strong>WGS84(EPSG:4326)</strong>로 재투영합니다.
        각 행정구역의 통계값(<code>{{VALUE_PROP}}</code> 속성)으로 색상을 매핑합니다.
      </p>
    </div>

    <p class="source">{{SOURCE}}</p>
  </div>

  <script>
    // ---------------------------------------------------------------------------
    // Configuration — replace these placeholders at render time
    // ---------------------------------------------------------------------------
    // GeoJSON FeatureCollection. Each feature's properties should include a
    // numeric value field (VALUE_PROP) for choropleth coloring.
    const GEOJSON_RAW = {{GEOJSON}};

    // Property key to use for choropleth value (e.g. "pop_cnt", "value", "비율")
    const VALUE_PROP = "{{VALUE_PROP}}";

    // Unit label shown in legend and tooltip (e.g. "명", "%", "백만원")
    const UNIT = "{{UNIT}}";

    // Number of color buckets for the choropleth scale
    const BUCKETS = 5;

    // ---------------------------------------------------------------------------
    // EPSG:5179 — Korea UTM-K (used by SGIS boundary API)
    // ---------------------------------------------------------------------------
    proj4.defs("EPSG:5179",
      "+proj=tmerc +lat_0=38 +lon_0=127.5 +k=0.9996 +x_0=1000000 +y_0=2000000 +ellps=GRS80 +units=m +no_defs");

    // ---------------------------------------------------------------------------
    // CRS auto-detection + reprojection (EPSG:5179 → WGS84)
    // ---------------------------------------------------------------------------
    function firstCoordOf(geom) {
      if (!geom) return null;
      switch (geom.type) {
        case "Point":          return geom.coordinates;
        case "MultiPoint":
        case "LineString":     return geom.coordinates[0];
        case "MultiLineString":
        case "Polygon":        return geom.coordinates[0][0];
        case "MultiPolygon":   return geom.coordinates[0][0][0];
        default:               return null;
      }
    }

    function reprojectCoords(coords) {
      if (typeof coords[0] === "number") {
        const [lon, lat] = proj4("EPSG:5179", "WGS84", coords);
        return [lon, lat];
      }
      return coords.map(reprojectCoords);
    }

    function reprojectGeom(geom) {
      return geom ? Object.assign({}, geom, { coordinates: reprojectCoords(geom.coordinates) }) : geom;
    }

    function detectAndReproject(fc) {
      if (!fc || !fc.features || !fc.features.length) return fc;
      const coord = firstCoordOf((fc.features[0] || {}).geometry);
      if (!coord) return fc;
      // UTM-K easting for Korea: ~600 000 – 1 400 000; WGS84 lon for Korea: 124–132
      const needsReproject = coord[0] > 1000 && coord[0] < 2000000;
      if (!needsReproject) return fc;
      return Object.assign({}, fc, {
        features: fc.features.map(f =>
          Object.assign({}, f, { geometry: reprojectGeom(f.geometry) })
        )
      });
    }

    // ---------------------------------------------------------------------------
    // Parse GeoJSON
    // ---------------------------------------------------------------------------
    let geojson;
    try {
      geojson = typeof GEOJSON_RAW === "string" ? JSON.parse(GEOJSON_RAW) : GEOJSON_RAW;
    } catch (e) {
      geojson = { type: "FeatureCollection", features: [] };
      console.error("GeoJSON 파싱 오류:", e);
    }
    const projected = detectAndReproject(geojson);

    // ---------------------------------------------------------------------------
    // Compute choropleth scale
    // ---------------------------------------------------------------------------
    const values = projected.features
      .map(f => parseFloat((f.properties || {})[VALUE_PROP]))
      .filter(v => isFinite(v));

    const minVal = values.length ? Math.min(...values) : 0;
    const maxVal = values.length ? Math.max(...values) : 1;

    // Sequential blue color ramp (light → dark)
    const RAMP = ["#d4e8f7","#93c4e4","#4da3d4","#1f77b4","#0d4b7a"];

    function getBucketIndex(v) {
      if (maxVal === minVal) return 0;
      const ratio = (v - minVal) / (maxVal - minVal);
      return Math.min(BUCKETS - 1, Math.floor(ratio * BUCKETS));
    }

    function getFillColor(feature) {
      const v = parseFloat((feature.properties || {})[VALUE_PROP]);
      if (!isFinite(v)) return "#cccccc";
      return RAMP[getBucketIndex(v)];
    }

    // ---------------------------------------------------------------------------
    // Leaflet map
    // ---------------------------------------------------------------------------
    const map = L.map("map");
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a> contributors",
      maxZoom: 19
    }).addTo(map);

    function style(feature) {
      return {
        fillColor: getFillColor(feature),
        fillOpacity: 0.7,
        color: "#ffffff",
        weight: 1,
        opacity: 0.9
      };
    }

    function onEachFeature(feature, layer) {
      const props = feature.properties || {};
      const name = props.adm_nm || props.name || props.SIG_KOR_NM ||
                   props.EMD_KOR_NM || props.bjdong_nm || "";
      const val = props[VALUE_PROP];
      const valStr = val != null ? Number(val).toLocaleString() + (UNIT ? " " + UNIT : "") : "-";
      layer.bindTooltip(`<strong>${name}</strong><br>${VALUE_PROP}: ${valStr}`, { sticky: true });
      layer.on({
        mouseover: function(e) {
          e.target.setStyle({ fillOpacity: 0.9, weight: 2, color: "#333" });
          e.target.bringToFront();
        },
        mouseout: function(e) { geoLayer.resetStyle(e.target); },
        click: function(e) {
          layer.bindPopup(
            `<strong>${name}</strong><br>${VALUE_PROP}: ${valStr}<br>` +
            `<pre style="font-size:11px;max-height:160px;overflow:auto">${JSON.stringify(props, null, 2)}</pre>`
          ).openPopup(e.latlng);
        }
      });
    }

    const geoLayer = L.geoJSON(projected, { style, onEachFeature }).addTo(map);

    try {
      map.fitBounds(geoLayer.getBounds(), { padding: [20, 20] });
    } catch (e) {
      map.setView([36.5, 127.5], 7);
    }

    // ---------------------------------------------------------------------------
    // Legend
    // ---------------------------------------------------------------------------
    const legendControl = L.control({ position: "bottomright" });
    legendControl.onAdd = function() {
      const div = L.DomUtil.create("div", "legend");
      const step = (maxVal - minVal) / BUCKETS;
      let html = `<div class="legend-title">${VALUE_PROP}${UNIT ? " (" + UNIT + ")" : ""}</div>`;
      for (let i = BUCKETS - 1; i >= 0; i--) {
        const lo = (minVal + step * i).toLocaleString(undefined, { maximumFractionDigits: 1 });
        const hi = (minVal + step * (i + 1)).toLocaleString(undefined, { maximumFractionDigits: 1 });
        html += `<div class="legend-row"><span class="legend-swatch" style="background:${RAMP[i]}"></span>${lo} – ${hi}</div>`;
      }
      html += `<div class="legend-row"><span class="legend-swatch" style="background:#ccc"></span>데이터 없음</div>`;
      div.innerHTML = html;
      return div;
    };
    legendControl.addTo(map);
  </script>
</body>
</html>
